name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]
  schedule:
    # Trigger model retraining weekly (every Sunday at 2 AM UTC)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target'
        required: true
        default: 'local'
        type: choice
        options:
        - local
        - aws
        - both
      retrain_model:
        description: 'Force model retraining'
        required: false
        default: false
        type: boolean

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/california-housing-api
  AWS_REGION: us-east-1
  EC2_INSTANCE_TYPE: t3.medium

jobs:
  # Job 1: Lint and Test (runs on all events)
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black pytest
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # - name: Format check with black
    #   run: |
    #     black --check --diff .

    - name: Run unit tests (no API required)
      run: |
        # Run unit tests that don't require API
        python -m pytest tests/test_unit.py -v --tb=short

    - name: Run basic Python syntax checks
      run: |
        # Run basic Python syntax validation on source code
        python -m py_compile src/*.py
        python -m py_compile api/*.py
        echo "✅ Python syntax validation passed"

    - name: Start services for API testing
      if: github.event_name != 'pull_request'
      run: |
        # Start services in background
        docker compose up -d --build
        echo "Services starting..."

    - name: Wait for services to be ready
      if: github.event_name != 'pull_request'
      run: |
        # Wait for API to be healthy
        echo "Waiting for API to start..."
        for i in {1..30}; do
          if curl -f http://localhost:8000/api/v1/health/ 2>/dev/null; then
            echo "✅ API is ready!"
            break
          fi
          echo "Waiting... ($i/30)"
          sleep 10
        done

    - name: Run API and integration tests
      if: github.event_name != 'pull_request'
      run: |
        # Run API tests (require running services)
        python -m pytest tests/test_api.py tests/test_api_comprehensive.py tests/test_prometheus.py -v --tb=short

    - name: Run PR-specific lightweight tests
      if: github.event_name == 'pull_request'
      run: |
        # Run only essential tests for feature PRs
        echo "🔍 Running lightweight tests for PR..."
        python -m pytest tests/test_unit.py -v --tb=short
        echo "✅ PR tests completed"

    - name: Cleanup services
      if: always() && (github.event_name != 'pull_request')
      run: |
        docker compose down

  # Job 2: Check for new data and retrain model (skip for PRs to non-main branches)
  check-data-and-retrain:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name != 'pull_request'
    outputs:
      model_updated: ${{ steps.retrain.outputs.model_updated }}
      model_version: ${{ steps.retrain.outputs.model_version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Check for new data
      id: check_data
      run: |
        # Simulate checking for new data (replace with actual data source check)
        echo "Checking for new data..."

        # Check if forced retraining is requested
        if [ "${{ github.event.inputs.retrain_model }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
          echo "new_data=true" >> $GITHUB_OUTPUT
          echo "🔄 Model retraining triggered"
        else
          # Check if .dvc file was updated in the latest commit
          # First check if we have more than one commit
          if git rev-list --count HEAD > /dev/null 2>&1 && [ $(git rev-list --count HEAD) -gt 1 ]; then
            if git diff --name-only HEAD~1 HEAD | grep -q '\.dvc$'; then
              echo "new_data=true" >> $GITHUB_OUTPUT
              echo "🔄 .dvc file updated, triggering retraining"
            else
              echo "new_data=false" >> $GITHUB_OUTPUT
              echo "✅ No .dvc update detected"
            fi
          else
            # For initial commits or single commit repos, check if .dvc files exist
            if find . -name "*.dvc" -type f | grep -q .; then
              echo "new_data=true" >> $GITHUB_OUTPUT
              echo "🔄 Initial commit with .dvc files detected, triggering retraining"
            else
              echo "new_data=false" >> $GITHUB_OUTPUT
              echo "✅ Initial commit, no .dvc files found"
            fi
          fi
        fi

    - name: Retrain model if needed
      id: retrain
      if: steps.check_data.outputs.new_data == 'true'
      run: |
        echo "🚀 Starting model retraining..."

        # Generate version
        VERSION=$(date +%Y%m%d-%H%M%S)
        echo "model_version=$VERSION" >> $GITHUB_OUTPUT

        # Load and preprocess data
        python -c "
        from sklearn.datasets import fetch_california_housing
        import pandas as pd
        import os

        os.makedirs('data/california_housing_dataset', exist_ok=True)
        data = fetch_california_housing(as_frame=True)
        df = data.frame
        df.to_csv('data/california_housing_dataset/housing.csv', index=False)
        print('✅ Data loaded successfully')
        "

        # Train models
        python -m src.model_train

        # Tag models with version
        mkdir -p models/versions/$VERSION
        cp models/*.joblib models/versions/$VERSION/

        echo "model_updated=true" >> $GITHUB_OUTPUT
        echo "✅ Model retraining completed - Version: $VERSION"

    - name: Upload model artifacts
      if: steps.retrain.outputs.model_updated == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: trained-models-${{ steps.retrain.outputs.model_version }}
        path: |
          models/
          mlruns/
        retention-days: 30

  # Job 3: Build and Push Docker Image (skip for PRs to non-main branches)
  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint-and-test, check-data-and-retrain]
    if: |
      always() && 
      needs.lint-and-test.result == 'success' &&
      github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
      version: ${{ steps.tags.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download model artifacts (if updated)
      if: needs.check-data-and-retrain.outputs.model_updated == 'true'
      uses: actions/download-artifact@v4
      with:
        name: trained-models-${{ needs.check-data-and-retrain.outputs.model_version }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Generate image tags
      id: tags
      run: |
        VERSION=${GITHUB_SHA:0:8}
        MODEL_VERSION=${{ needs.check-data-and-retrain.outputs.model_version }}

        if [ "$MODEL_VERSION" != "" ]; then
          VERSION="${VERSION}-model-${MODEL_VERSION}"
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "image_tag=${DOCKER_IMAGE}:${VERSION}" >> $GITHUB_OUTPUT
        echo "latest_tag=${DOCKER_IMAGE}:latest" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ steps.tags.outputs.image_tag }}
          ${{ steps.tags.outputs.latest_tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 4: Deploy Locally (skip for PRs to non-main branches)
  deploy-local:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.event.inputs.deploy_target == 'local' ||
       github.event.inputs.deploy_target == 'both' ||
       github.event.inputs.deploy_target == '')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Pull latest images
      run: |
        docker compose pull

    - name: Deploy locally
      run: |
        chmod +x scripts/deploy.sh
        ./scripts/deploy.sh deploy

    - name: Run deployment tests
      run: |
        sleep 30  # Wait for services to be ready
        ./scripts/deploy.sh smoke

    - name: Generate deployment report
      run: |
        echo "## 🚀 Local Deployment Report" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ${{ needs.build-and-push.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ✅ Successfully deployed" >> $GITHUB_STEP_SUMMARY
        echo "- **Services**: API, Prometheus, Grafana, Node Exporter" >> $GITHUB_STEP_SUMMARY

  # Job 5: Deploy to AWS (skip for PRs to non-main branches)
  deploy-aws:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.event.inputs.deploy_target == 'aws' ||
       github.event.inputs.deploy_target == 'both')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to EC2
      run: |
        chmod +x scripts/aws-deploy.sh
        ./scripts/aws-deploy.sh full

  # Job 6: Notification and Cleanup (skip for PRs to non-main branches)
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-local, deploy-aws]
    if: |
      always() && github.event_name != 'pull_request'

    steps:
    - name: Send notification
      run: |
        echo "🎉 MLOps pipeline completed!"
        echo "Local deployment: ${{ needs.deploy-local.result }}"
        echo "AWS deployment: ${{ needs.deploy-aws.result }}"

  # Job 7: PR Summary (only for PRs)
  pr-summary:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'pull_request'

    steps:
    - name: Generate PR Summary
      run: |
        echo "## 🔍 Pull Request Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Tests Completed" >> $GITHUB_STEP_SUMMARY
        if [ "${{ github.base_ref }}" = "main" ]; then
          echo "- **Test Type**: Full test suite (PR to main)" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage**: Linting, Unit Tests, API Tests, Integration Tests" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Test Type**: Lightweight test suite (Feature PR)" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage**: Linting, Unit Tests, Syntax Validation" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- **Status**: ${{ needs.lint-and-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ⏭️ Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- Model retraining, Docker build, and deployment will run after merge" >> $GITHUB_STEP_SUMMARY
        echo "- Full pipeline execution on main/develop branches" >> $GITHUB_STEP_SUMMARY
